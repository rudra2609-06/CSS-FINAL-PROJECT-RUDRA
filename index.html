<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS-FINAL-PROJECT</title>
	<link rel="stylesheet" href="./css/style.css" type="text/css">
	<link rel="stylesheet" href="./fonts/stylesheet.css" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" type="text/css">
</head>

<body>
	<!-- header section starts -->
	<header>
		<div class="container">
			<main class="d-flex justify-center align-center">
				<nav class="navbar">
					<h2>My Website</h2>
					<ul class="d-flex align-center">
						<li><a href="javascript:void(0)">Home</a></li>
						<li><a href="javascript:void(0)">About</a></li>
						<li><a href="javascript:void(0)">Contact</a></li>
					</ul>
				</nav>
			</main>
		</div>
	</header>
	<!-- header section ends -->

	<!-- about  section starts  -->
	<section class="about">
		<div class="row align-center">
		  <div class="col-6 about-content">
			<h2>About Me</h2>
			<p>This is a simple webpage <br> created for my final CSS project. <br> It includes offline fonts,form
			  and a <br>proper structure.<br></p>
			<div class="about-icon">
			  <i class="bi bi-github"></i>
			  <a href="https://github.com/" target="_blank">GitHub</a>
			  <i class="bi bi-linkedin"></i>
			  <a href="https://in.linkedin.com/" target="_blank">linkedin</a>
			</div>
		  </div>
		  <div class="col-6 contact_me">
			<h2>Contact Me</h2>
			<form method="post target="_blank">
				<label for="Name">Name</label>
				<br>
				<input type="text" name="Name" id="name">
				<br>
				<label for="email">Email</label>
				<br>
				<input type="email" id="email" name="email">
				<br>
				<input type="submit" value="Submit" class="btn">
			</form>
			</div>
		</div>
	  </section>
	<!-- about section ends -->

	<!-- hero section starts -->
	 <section class="hero">
		<img src="./images/hero_img.jpg" alt="hero_img">
	 </section>
	 <!-- hero section ends  -->

	 <!-- footer section starts  -->
	 <footer>
		<div class="container">
			<div class="main d-flex justify-between">
				<p>Copyright &#169; 2025</p>
				<div class="footer-icon">
					<a href="https://github.com/" target="_blank">GitHub</a>
				   <a href="https://in.linkedin.com/" target="_blank">linkedin</a>
				</div>
			</div>
		</div>
	 </footer>
	 <!-- footer section ends -->
</body>
</html>
